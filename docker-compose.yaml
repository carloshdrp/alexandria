x-php: &php
    build:
        context: './docker/php'
        dockerfile: Dockerfile
        additional_contexts:
            sail: 'service:sail-runtime'
    image: 'alexandria/php'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        - pgsql
        - redis

services:
    sail-runtime:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                PHP_EXTENSIONS: fpm
        image: 'sail-8.5/app'
        scale: 0
    nginx:
        build:
            context: './docker/nginx'
            dockerfile: Dockerfile
        image: 'alexandria/nginx'
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - '.:/var/www/html:ro'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_healthy
    laravel.test:
        <<: *php
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            SUPERVISOR_PHP_USER: root
        command:
            - php-fpm8.5
            - '--nodaemonize'
            - '--force-stderr'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        expose:
            - '9000'
        healthcheck:
            test:
                - CMD
                - bash
                - '-c'
                - 'exec 3<>/dev/tcp/127.0.0.1/9000'
            interval: 5s
            timeout: 3s
            retries: 12
            start_period: 15s
    queue:
        <<: *php
        command:
            - php
            - artisan
            - 'queue:work'
            - redis
            - '--queue=default'
            - '--tries=1'
            - '--timeout=60'
            - '--memory=128'
            - '--max-time=3600'
        restart: unless-stopped
        stop_grace_period: 90s
    scheduler:
        <<: *php
        command:
            - php
            - artisan
            - 'schedule:work'
        restart: unless-stopped
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
