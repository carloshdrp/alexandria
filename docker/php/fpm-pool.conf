[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = sail

listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 0
security.limit_extensions = .php
